<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f8f6">
<title>Lakeglass V5 Preview</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="archive.css">
<style>
#v5boot{min-height:100dvh;display:grid;place-items:center;padding:28px;background:#fffdf8;color:#29454c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.v5card{width:min(520px,100%);padding:24px;border:1px solid #d8e1df;border-radius:20px;background:#fff;box-shadow:0 12px 40px rgba(41,69,76,.08)}
.v5card h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:34px;font-weight:500;margin:0 0 10px}
.v5card p{line-height:1.55;color:#677a7f}.v5card a{display:block;margin-top:12px;border-radius:999px;padding:13px 16px;text-align:center;text-decoration:none;background:#315f69;color:#fff}
.v5-source-note{margin:10px 0 18px;padding:10px 12px;border:1px solid #d8e1df;border-radius:12px;background:#f2f7f5;color:#536b71;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div id="v5boot"><div class="v5card"><h1>Opening upgraded Lakeglass…</h1><p id="v5msg">Preparing your protected V5 archive.</p></div></div>
<script>
(async()=>{
  const SNAPSHOT='75562c0a67c7fae5f86fe164a7865ce0f21a5a75';
  const CDN=`https://cdn.jsdelivr.net/gh/iphiginea/lakeglass@${SNAPSHOT}/`;
  const msg=document.getElementById('v5msg');
  const openDb=()=>new Promise((resolve,reject)=>{const r=indexedDB.open('lakeglass-archive');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
  const read=(db,key)=>new Promise((resolve,reject)=>{const tx=db.transaction('collection','readonly');const r=tx.objectStore('collection').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
  const ids=rows=>(Array.isArray(rows)?rows:[]).map(r=>String(r?.id||'')).filter(Boolean).sort();
  const containsOriginal=(shadow,original)=>{const set=new Set(ids(shadow));return ids(original).every(id=>set.has(id));};
  const loadScript=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error(`Could not load ${src}`));document.body.appendChild(s);});

  try{
    if(!('indexedDB' in window)) throw new Error('IndexedDB is unavailable in this browser.');
    const db=await openDb();
    if(!db.objectStoreNames.contains('collection')){db.close();throw new Error('Lakeglass collection store not found.');}
    const original=await read(db,'specimens');
    const originalCounters=await read(db,'accessionCounters');
    const shadow=await read(db,'specimensV5');
    db.close();
    if(!Array.isArray(original)||!original.length) throw new Error('The protected original collection is not visible in this browser context.');

    let usingShadow=Array.isArray(shadow)&&shadow.length&&containsOriginal(shadow,original);
    if(!usingShadow){
      const db2=await openDb();
      await new Promise((resolve,reject)=>{
        const tx=db2.transaction('collection','readwrite');
        const store=tx.objectStore('collection');
        store.put(structuredClone(original),'specimensV5');
        store.put(structuredClone(originalCounters||{}),'accessionCountersV5');
        store.put({schemaVersion:5,revision:0,lastExportAt:null,lastExportCount:0,lastExportRevision:0,shadow:true,baseOriginalIds:ids(original),baseOriginalCount:original.length,createdAt:new Date().toISOString()},'archiveMetaV5');
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Could not initialize V5 shadow archive.'));
      });
      db2.close();
      usingShadow=false;
    }

    msg.textContent=`${original.length} protected specimen${original.length===1?'':'s'} found. Loading the interactive V5 app…`;

    const html=await fetch(CDN+'index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load the V5 interface.');return r.text();});
    const parsed=new DOMParser().parseFromString(html,'text/html');
    const root=parsed.querySelector('#lake-glass-mockup');
    if(!root) throw new Error('The V5 interface snapshot is invalid.');
    document.body.innerHTML='';
    document.body.appendChild(document.importNode(root,true));

    const fieldNote=document.querySelector('[data-screen="home"] .field-note');
    if(fieldNote){
      const note=document.createElement('div');
      note.className='v5-source-note';
      note.id='v5StorageStatus';
      note.textContent=usingShadow
        ? `V5 saved archive loaded · ${shadow.length} records · original archive protected`
        : `V5 shadow initialized from ${original.length} protected original records`;
      fieldNote.before(note);
    }

    await loadScript('./data.js?v5static=2');
    await loadScript('./v5-storage-shim.js?v5static=2');
    await loadScript(CDN+'app.js');

    setTimeout(()=>{
      const del=document.getElementById('deleteSpecimenBtn');
      if(del){del.disabled=true;del.title='Deletion is disabled while V5 is in protected preview mode.';del.textContent='Delete disabled in preview';}
    },100);
  }catch(err){
    document.body.innerHTML=`<div id="v5boot"><div class="v5card"><h1>V5 did not open</h1><p>${String(err?.message||err)}</p><p>Your original archive was not modified.</p><a href="./recover.html">Check original archive</a><a href="./">Return to stable Lakeglass</a></div></div>`;
  }
})();
</script>
</body>
</html>
