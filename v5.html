<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8f6"><title>Lakeglass V5 Preview</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="archive.css"><style>#v5boot{min-height:100dvh;display:grid;place-items:center;padding:28px;background:#fffdf8;color:#29454c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.v5card{width:min(520px,100%);padding:24px;border:1px solid #d8e1df;border-radius:20px;background:#fff}.v5card h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:34px;font-weight:500;margin:0 0 10px}.v5card p{line-height:1.55;color:#677a7f}.v5card a{display:block;margin-top:12px;border-radius:999px;padding:13px 16px;text-align:center;text-decoration:none;background:#315f69;color:#fff}</style></head><body><div id="v5boot"><div class="v5card"><h1>Opening upgraded Lakeglass…</h1><p id="v5msg">Checking the verified V5 archive copy.</p></div></div><script>(async()=>{const msg=document.getElementById('v5msg');function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('lakeglass-archive');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}function get(db,key){return new Promise((resolve,reject)=>{const tx=db.transaction('collection','readonly'),r=tx.objectStore('collection').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}function script(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}try{const db=await openDb();const meta=await get(db,'archiveMetaV5');const rows=await get(db,'specimensV5');db.close();if(!meta?.verified||!Array.isArray(rows)){document.getElementById('v5boot').innerHTML='<div class="v5card"><h1>V5 archive not ready</h1><p>The upgraded preview only opens after a separate V5 copy has been verified. Your stable archive has not been changed.</p><a href="./upgrade-safe.html">Create verified V5 copy →</a><a href="./">Return to stable Lakeglass</a></div>';return;}msg.textContent=`Verified ${rows.length} specimen${rows.length===1?'':'s'}. Loading the isolated preview…`;const base='https://raw.githubusercontent.com/iphiginea/lakeglass/75562c0a67c7fae5f86fe164a7865ce0f21a5a75/';const html=await fetch(base+'index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load V5 interface snapshot.');return r.text();});const parsed=new DOMParser().parseFromString(html,'text/html');const root=parsed.querySelector('#lake-glass-mockup');if(!root)throw new Error('V5 interface snapshot is invalid.');document.body.innerHTML='';document.body.appendChild(document.importNode(root,true));await script('./data.js');await script('./v5-storage-shim.js');const code=await fetch(base+'app.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load V5 application snapshot.');return r.text();});new Function(code)();}catch(err){document.getElementById('v5boot').innerHTML=`<div class="v5card"><h1>Preview did not open</h1><p>${String(err&&err.message||err)}</p><p>The stable archive is separate and was not modified.</p><a href="./">Return to stable Lakeglass</a></div>`;}})();</script></body></html>
