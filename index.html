#v5boot{min-height:100dvh;display:grid;place-items:center;padding:28px;background:#fffdf8;color:#29454c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.v5card{width:min(520px,100%);padding:24px;border:1px solid #d8e1df;border-radius:20px;background:#fff;box-shadow:0 12px 40px rgba(41,69,76,.08)}
.v5card h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:34px;font-weight:500;margin:0 0 10px}
.v5card p{line-height:1.55;color:#677a7f}.v5card a{display:block;margin-top:12px;border-radius:999px;padding:13px 16px;text-align:center;text-decoration:none;background:#315f69;color:#fff}
.v5-source-note{margin:10px 0 18px;padding:10px 12px;border:1px solid #d8e1df;border-radius:12px;background:#f2f7f5;color:#536b71;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div id="v5boot"><div class="v5card"><h1>Opening Lakeglass…</h1><p id="v5msg">Preparing your on-device archive.</p></div></div>
