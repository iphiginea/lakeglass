name: Apply diagnostic wording patch
on:
  push:
    paths:
      - '.github/workflows/v5-syntax-check.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply terminology rewrite
        run: python .github/scripts/clarify_diagnostics.py
      - name: Check JavaScript
        run: node --check v5-app.js
      - name: Commit clearer labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5-app.js v5-shell.html
          git commit -m "Explain glass diagnostic terms in plain language"
          git push
