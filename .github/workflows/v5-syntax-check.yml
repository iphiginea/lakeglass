name: Lakeglass JavaScript check
on:
  push:
    paths:
      - 'main-boot.js'
      - 'v5-app.js'
      - 'v5-data.js'
      - 'v5-storage-shim.js'
      - 'v5-shell.html'
      - '.github/workflows/v5-syntax-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check production JavaScript
        run: |
          node --check main-boot.js
          node --check v5-app.js
          node --check v5-data.js
          node --check v5-storage-shim.js
