<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f8f6">
  <title>Refreshing Lakeglass…</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fffdf8;color:#29454c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:28px;box-sizing:border-box}
    main{max-width:420px;text-align:center}
    h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:38px;font-weight:500;margin:0 0 12px}
    p{font-size:14px;line-height:1.6;color:#718084;margin:0}
  </style>
</head>
<body>
  <main>
    <h1>Refreshing Lakeglass</h1>
    <p>Your specimen archive is staying exactly where it is. Only the offline app cache is being refreshed.</p>
  </main>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg=>reg.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(key=>key.startsWith('lakeglass-')).map(key=>caches.delete(key)));
        }
        if('serviceWorker' in navigator){
          let claimed=false;
          const claimedPromise=new Promise(resolve=>{
            const finish=()=>{if(claimed)return;claimed=true;resolve();};
            navigator.serviceWorker.addEventListener('controllerchange',finish,{once:true});
            setTimeout(finish,2500);
          });
          await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
          await navigator.serviceWorker.ready;
          await claimedPromise;
        }
      }catch(err){}
      location.replace('./?refreshed='+Date.now());
    })();
  </script>
</body>
</html>
